<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NSE Swing &amp; Intraday Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E13;
    --panel:#12161E;
    --panel-border:#212734;
    --text:#E7ECF3;
    --muted:#7C8AA0;
    --accent:#3DD9C6;
    --up:#1FCF7D;
    --down:#F0466B;
    --warn:#F0B23D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    border-bottom:1px solid var(--panel-border);
    padding:22px 24px 18px;
    position:sticky; top:0;
    background:rgba(11,14,19,0.92);
    backdrop-filter:blur(8px);
    z-index:10;
  }
  .header-row{
    display:flex; align-items:baseline; justify-content:space-between;
    max-width:1100px; margin:0 auto; flex-wrap:wrap; gap:8px;
  }
  h1{
    font-size:20px; font-weight:800; letter-spacing:-0.02em;
  }
  h1 span{color:var(--accent); font-family:'IBM Plex Mono', monospace;}
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--muted);
  }
  .disclaimer{
    max-width:1100px; margin:14px auto 0; padding:10px 14px;
    border:1px solid var(--warn); border-left:3px solid var(--warn);
    border-radius:4px; font-size:12.5px; color:var(--warn);
    background:rgba(240,178,61,0.06);
  }
  main{max-width:1100px; margin:0 auto; padding:24px;}
  .columns{
    display:grid; grid-template-columns:1fr 1fr; gap:22px;
  }
  @media(max-width:820px){ .columns{grid-template-columns:1fr;} }

  .col-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:12px; padding-left:2px;
  }
  .col-title.swing{color:var(--accent);}
  .col-title.intraday{color:var(--warn);}

  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
  }
  .card-recommended{
    border:1px solid var(--up);
    box-shadow:0 0 0 1px rgba(31,207,125,0.15);
  }
  .rec-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:0.05em;
    color:var(--up); background:rgba(31,207,125,0.12);
    border:1px solid var(--up); border-radius:4px;
    padding:2px 6px; vertical-align:middle;
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:10px;
  }
  .symbol{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px; font-weight:700;
  }
  .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; color:var(--muted); margin-top:2px;
  }
  .rank{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted);
    border:1px solid var(--panel-border); border-radius:4px;
    padding:2px 6px;
  }
  .score-row{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .score-label{font-size:11px; color:var(--muted); width:64px; font-family:'IBM Plex Mono', monospace;}
  .score-bar-bg{flex:1; height:6px; background:#1A2029; border-radius:3px; overflow:hidden;}
  .score-bar-fill{height:100%; border-radius:3px;}
  .score-num{font-family:'IBM Plex Mono', monospace; font-size:12px; width:34px; text-align:right;}

  .reasons{
    margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;
  }
  .tag{
    font-size:11px; padding:4px 8px; border-radius:12px;
    background:#1A2029; color:var(--muted); border:1px solid var(--panel-border);
  }
  .tag.fund{color:#9AA9C8;}

  .trade-levels{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--panel-border);
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  }
  .tl-item{display:flex; flex-direction:column; gap:2px;}
  .tl-label{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}
  .tl-val{font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600;}
  .tl-val.up{color:var(--up);}
  .tl-val.down{color:var(--down);}

  .empty{
    color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:13px;
    padding:30px; text-align:center; border:1px dashed var(--panel-border); border-radius:8px;
  }
  footer{
    max-width:1100px; margin:20px auto 0; padding:0 24px;
    font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>NSE <span>SCANNER</span></h1>
    <div class="meta" id="meta">loading…</div>
  </div>
</header>

<main>
  <div class="disclaimer" id="disclaimer"></div>

  <div class="columns" style="margin-top:22px;">
    <div>
      <div class="col-title swing">Swing Picks — Multi-Day Setups</div>
      <div id="swing-list"></div>
    </div>
    <div>
      <div class="col-title intraday">Intraday Picks — Momentum-Led</div>
      <div id="intraday-list"></div>
    </div>
  </div>
</main>

<footer>
  Rule-based technical + fundamental scoring. Not investment advice. Always apply your own risk management.
</footer>

<script>
function scoreColor(score){
  if(score >= 75) return 'var(--up)';
  if(score >= 55) return 'var(--warn)';
  return 'var(--down)';
}

function renderCard(pick, rank, isIntraday){
  const techReasons = isIntraday ? (pick.reasons?.intraday_technical || []) : (pick.reasons?.technical || []);
  const reasonsTech = techReasons.map(r => `<span class="tag">${r}</span>`).join('');
  const reasonsFund = (pick.reasons?.fundamental || []).map(r => `<span class="tag fund">${r}</span>`).join('');
  const badge = (!isIntraday && pick.recommended) ? `<span class="rec-badge">★ RECOMMENDED</span>` : '';

  return `
  <div class="card${(!isIntraday && pick.recommended) ? ' card-recommended' : ''}">
    <div class="card-top">
      <div>
        <div class="symbol">${pick.symbol} ${badge}</div>
        <div class="price">₹${pick.close?.toFixed ? pick.close.toFixed(2) : pick.close} · ATR ${pick.atr14 ?? '—'} ${pick.sector ? '· ' + pick.sector : ''}</div>
      </div>
      <div class="rank">#${rank}</div>
    </div>

    <div class="score-row">
      <div class="score-label">SWING</div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pick.swing_score}%; background:${scoreColor(pick.swing_score)}"></div></div>
      <div class="score-num">${pick.swing_score}</div>
    </div>
    <div class="score-row">
      <div class="score-label">INTRADAY</div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pick.intraday_score}%; background:${scoreColor(pick.intraday_score)}"></div></div>
      <div class="score-num">${pick.intraday_score}</div>
    </div>

    <div class="reasons">${reasonsTech}${reasonsFund}</div>

    ${pick.trade_levels && pick.trade_levels.entry ? `
    <div class="trade-levels">
      <div class="tl-item"><span class="tl-label">Entry</span><span class="tl-val">₹${pick.trade_levels.entry}</span></div>
      <div class="tl-item"><span class="tl-label">Stop-loss</span><span class="tl-val down">₹${pick.trade_levels.stop_loss}</span></div>
      <div class="tl-item"><span class="tl-label">Target</span><span class="tl-val up">₹${pick.trade_levels.target}</span></div>
      <div class="tl-item"><span class="tl-label">R:R</span><span class="tl-val">${pick.trade_levels.reward_risk_ratio}:1</span></div>
    </div>` : ''}
  </div>`;
}

fetch('data/daily_picks.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('meta').textContent =
      `Updated ${new Date(data.generated_at).toLocaleString('en-IN')} · ${data.universe_size_scanned} stocks scanned (${data.universe})`;
    document.getElementById('disclaimer').textContent = data.disclaimer;

    const swingEl = document.getElementById('swing-list');
    const intradayEl = document.getElementById('intraday-list');

    if(!data.swing_picks?.length){
      swingEl.innerHTML = '<div class="empty">No picks yet — run the scan.</div>';
    } else {
      swingEl.innerHTML = data.swing_picks.map((p,i) => renderCard(p, i+1, false)).join('');
    }

    if(!data.intraday_picks?.length){
      intradayEl.innerHTML = '<div class="empty">No picks yet — run the scan.</div>';
    } else {
      intradayEl.innerHTML = data.intraday_picks.map((p,i) => renderCard(p, i+1, true)).join('');
    }
  })
  .catch(err => {
    document.getElementById('meta').textContent = 'Could not load picks';
    document.getElementById('swing-list').innerHTML = '<div class="empty">data/daily_picks.json not found yet. Run the scan script first.</div>';
    document.getElementById('intraday-list').innerHTML = '';
    console.error(err);
  });
</script>

</body>
</html>
